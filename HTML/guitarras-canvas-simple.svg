<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  
  <!-- Definiciones de estilos y efectos -->
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    
    <!-- Gradiente botón primario -->
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#45b7b8"/>
    </linearGradient>
    
    <!-- Sombras -->
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#4ecdc4" flood-opacity="0.3"/>
    </filter>
    
    <!-- Patrón de guitarra simplificado -->
    <pattern id="guitar" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="#2c3e50"/>
      <!-- Cuerpo de guitarra -->
      <ellipse cx="200" cy="180" rx="120" ry="80" fill="#8b4513"/>
      <ellipse cx="200" cy="180" rx="100" ry="60" fill="#a0522d"/>
      <circle cx="200" cy="180" r="30" fill="#000" opacity="0.4"/>
      <!-- Mástil -->
      <rect x="180" y="80" width="40" height="200" fill="#654321"/>
      <!-- Cuerdas -->
      <g stroke="#c0c0c0" stroke-width="2">
        <line x1="185" y1="80" x2="185" y2="280"/>
        <line x1="190" y1="80" x2="190" y2="280"/>
        <line x1="195" y1="80" x2="195" y2="280"/>
        <line x1="200" y1="80" x2="200" y2="280"/>
        <line x1="205" y1="80" x2="205" y2="280"/>
        <line x1="210" y1="80" x2="210" y2="280"/>
      </g>
      <!-- Manos -->
      <ellipse cx="140" cy="200" rx="35" ry="50" fill="#deb887" opacity="0.8"/>
      <ellipse cx="260" cy="150" rx="25" ry="40" fill="#deb887" opacity="0.8"/>
    </pattern>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Header con transparencia -->
  <rect x="0" y="0" width="1200" height="80" fill="#1a1a2e" opacity="0.95"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#ffffff" stroke-opacity="0.1"/>
  
  <!-- Logo -->
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
    guitarluthier.com
  </text>
  
  <!-- Navegación centrada -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Inicio (activo) -->
    <text x="-200" y="0" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Inicio</text>
    <rect x="-215" y="8" width="30" height="2" fill="#4ecdc4" rx="1"/>
    
    <!-- Otros enlaces -->
    <text x="-100" y="0" font-family="Arial, sans-serif" font-size="16" fill="#b8b8b8">Acerca de</text>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#b8b8b8">Servicios</text>
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" fill="#b8b8b8">Blog</text>
    <text x="180" y="0" font-family="Arial, sans-serif" font-size="16" fill="#b8b8b8">Contacto</text>
  </g>
  
  <!-- Botón CTA Header -->
  <g transform="translate(1050, 25)">
    <rect width="120" height="30" rx="6" fill="url(#btnPrimary)" filter="url(#shadow2)"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1a1a2e" text-anchor="middle">
      Explora Ahora
    </text>
  </g>
  
  <!-- Sección Hero -->
  <g transform="translate(80, 150)">
    
    <!-- Contenido izquierdo -->
    <g>
      <!-- Badge -->
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#6c757d" opacity="0.3"/>
      <text x="75" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="500" 
            fill="#6c757d" text-anchor="middle" letter-spacing="1px">
        CALIDAD SUPERIOR
      </text>
      
      <!-- Título principal -->
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
        <tspan x="0" dy="0">Guitarras</tspan>
        <tspan x="0" dy="60">Personalizadas</tspan>
        <tspan x="0" dy="60">Hechas a Mano</tspan>
        <tspan x="0" dy="60">en España</tspan>
      </text>
      
      <!-- Descripción -->
      <text x="0" y="340" font-family="Arial, sans-serif" font-size="19" fill="#b8b8b8" line-height="1.6">
        <tspan x="0" dy="0">Descubre la perfección en la fabricación de</tspan>
        <tspan x="0" dy="30">guitarras Españolas hechas para cada músico,</tspan>
        <tspan x="0" dy="30">con atención al detalle excepcional.</tspan>
      </text>
      
      <!-- Botón CTA principal -->
      <g transform="translate(0, 450)">
        <rect width="170" height="45" rx="8" fill="none" stroke="#4ecdc4" stroke-width="2" filter="url(#shadow2)"/>
        <text x="85" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="500" 
              fill="#4ecdc4" text-anchor="middle">
          Explora Ahora
        </text>
      </g>
    </g>
    
    <!-- Imagen de guitarra -->
    <g transform="translate(550, 0)">
      <rect width="450" height="450" rx="20" fill="url(#guitar)" filter="url(#shadow1)"/>
    </g>
    
  </g>
  
  <!-- Elementos de interacción para Canvas (invisibles) -->
  <g id="canvas-interactions" opacity="0">
    
    <!-- Área del logo -->
    <rect id="logo-area" x="40" y="20" width="250" height="40" fill="red" data-action="logo-click"/>
    
    <!-- Áreas de navegación -->
    <rect id="nav-inicio" x="380" y="30" width="60" height="30" fill="red" data-action="nav-inicio"/>
    <rect id="nav-acerca" x="480" y="30" width="80" height="30" fill="red" data-action="nav-acerca"/>
    <rect id="nav-servicios" x="580" y="30" width="80" height="30" fill="red" data-action="nav-servicios"/>
    <rect id="nav-blog" x="680" y="30" width="50" height="30" fill="red" data-action="nav-blog"/>
    <rect id="nav-contacto" x="750" y="30" width="80" height="30" fill="red" data-action="nav-contacto"/>
    
    <!-- Área del botón header -->
    <rect id="btn-header" x="1050" y="25" width="120" height="30" fill="red" data-action="explore-header"/>
    
    <!-- Área del botón principal -->
    <rect id="btn-main" x="80" y="600" width="170" height="45" fill="red" data-action="explore-main"/>
    
    <!-- Área de la imagen -->
    <rect id="guitar-image" x="630" y="150" width="450" height="450" fill="red" data-action="guitar-details"/>
    
  </g>
  
  <!-- Metadata para Canvas Apps -->
  <metadata>
    <canvas-app-data>
      <title>Guitarras Personalizadas Canvas SVG</title>
      <version>1.0</version>
      <interactive-elements>
        <element id="logo-area" action="logo-click" description="Logo guitarluthier.com"/>
        <element id="nav-inicio" action="nav-inicio" description="Navegación Inicio"/>
        <element id="nav-acerca" action="nav-acerca" description="Navegación Acerca de"/>
        <element id="nav-servicios" action="nav-servicios" description="Navegación Servicios"/>
        <element id="nav-blog" action="nav-blog" description="Navegación Blog"/>
        <element id="nav-contacto" action="nav-contacto" description="Navegación Contacto"/>
        <element id="btn-header" action="explore-header" description="Botón Explora Ahora Header"/>
        <element id="btn-main" action="explore-main" description="Botón Explora Ahora Principal"/>
        <element id="guitar-image" action="guitar-details" description="Imagen de Guitarra"/>
      </interactive-elements>
      <colors>
        <primary>#4ecdc4</primary>
        <background>#1a1a2e</background>
        <secondary>#16213e</secondary>
        <text-primary>#ffffff</text-primary>
        <text-secondary>#b8b8b8</text-secondary>
      </colors>
    </canvas-app-data>
  </metadata>
  
</svg>
