<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitarras Canvas - Inline Version</title>
    <style>
        /* CSS INLINE PARA CANVAS */
        :root {
            --primary-turquoise: #4ecdc4;
            --primary-turquoise-hover: #45b7b8;
            --dark-navy: #1a1a2e;
            --dark-blue: #16213e;
            --text-white: #ffffff;
            --text-gray: #b8b8b8;
            --badge-color: #6c757d;
            --font-primary: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --space-xs: 0.5rem; --space-sm: 1rem; --space-md: 1.5rem; --space-lg: 2rem; --space-xl: 3rem; --space-2xl: 4rem;
            --header-height: 80px; --container-max: 1200px; --border-radius: 8px; --transition: 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-primary); line-height: 1.6; color: var(--text-white); 
               background: linear-gradient(135deg, var(--dark-navy) 0%, var(--dark-blue) 100%); 
               min-height: 100vh; overflow-x: hidden; }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; 
                  background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); 
                  border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: var(--header-height); }
        .header__container { max-width: var(--container-max); margin: 0 auto; height: 100%; 
                             display: flex; align-items: center; justify-content: space-between; 
                             padding: 0 var(--space-lg); }
        .header__logo .logo { font-size: 1.5rem; font-weight: 600; color: var(--text-white); 
                              text-decoration: none; transition: var(--transition); }
        .header__logo .logo:hover { color: var(--primary-turquoise); }
        .header__nav { flex: 1; display: flex; justify-content: center; }
        .nav-list { display: flex; list-style: none; gap: var(--space-xl); align-items: center; }
        .nav-link { color: var(--text-gray); text-decoration: none; font-weight: 500; font-size: 0.95rem; 
                    padding: var(--space-xs) var(--space-sm); border-radius: var(--border-radius); 
                    transition: var(--transition); position: relative; }
        .nav-link:hover, .nav-link--active { color: var(--text-white); }
        .nav-link--active::after { content: ''; position: absolute; bottom: -2px; left: 50%; 
                                    transform: translateX(-50%); width: 20px; height: 2px; 
                                    background: var(--primary-turquoise); border-radius: 1px; }
        .btn { padding: var(--space-sm) var(--space-lg); border: none; border-radius: var(--border-radius); 
               font-family: var(--font-primary); font-weight: 500; font-size: 0.95rem; cursor: pointer; 
               transition: var(--transition); text-decoration: none; display: inline-flex; 
               align-items: center; justify-content: center; }
        .btn--primary { background: var(--primary-turquoise); color: var(--dark-navy); 
                        border: 2px solid var(--primary-turquoise); }
        .btn--primary:hover { background: var(--primary-turquoise-hover); 
                              border-color: var(--primary-turquoise-hover); transform: translateY(-2px); 
                              box-shadow: 0 8px 25px rgba(78, 205, 196, 0.3); }
        .btn--secondary { background: transparent; color: var(--primary-turquoise); 
                          border: 2px solid var(--primary-turquoise); }
        .btn--secondary:hover { background: var(--primary-turquoise); color: var(--dark-navy); 
                                transform: translateY(-2px); box-shadow: 0 8px 25px rgba(78, 205, 196, 0.3); }
        .mobile-toggle { display: none; flex-direction: column; background: none; border: none; 
                         cursor: pointer; padding: var(--space-xs); }
        .hamburger { width: 25px; height: 3px; background: var(--text-white); margin: 3px 0; 
                     transition: var(--transition); border-radius: 2px; }
        .hero { padding-top: var(--header-height); min-height: 100vh; display: flex; align-items: center; }
        .hero__container { max-width: var(--container-max); margin: 0 auto; padding: var(--space-2xl) var(--space-lg); 
                           display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2xl); align-items: center; }
        .hero__content { max-width: 500px; }
        .hero__badge { display: inline-block; background: rgba(108, 117, 125, 0.2); color: var(--badge-color); 
                       padding: var(--space-xs) var(--space-md); border-radius: 20px; font-size: 0.8rem; 
                       font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: var(--space-md); }
        .hero__title { font-size: 3.5rem; font-weight: 700; line-height: 1.1; color: var(--text-white); 
                       margin-bottom: var(--space-lg); }
        .hero__description { font-size: 1.1rem; color: var(--text-gray); line-height: 1.7; 
                             margin-bottom: var(--space-xl); max-width: 90%; }
        .hero__cta { padding: var(--space-md) var(--space-xl); font-size: 1.1rem; }
        .hero__image { position: relative; height: 600px; overflow: hidden; border-radius: 16px; 
                       box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        .hero__img { width: 100%; height: 100%; object-fit: cover; object-position: center; 
                     transition: transform 0.6s ease; }
        .hero__image:hover .hero__img { transform: scale(1.05); }
        @media (max-width: 768px) {
            .header__nav { display: none; } .mobile-toggle { display: flex; }
            .hero__container { grid-template-columns: 1fr; gap: var(--space-lg); text-align: center; }
            .hero__content { max-width: 100%; order: 2; } .hero__image { order: 1; height: 400px; }
            .hero__title { font-size: 2.5rem; } .hero__description { max-width: 100%; }
        }
        @media (max-width: 480px) {
            .hero__title { font-size: 2rem; } .hero__image { height: 300px; }
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .hero__badge, .hero__title, .hero__description, .hero__cta { animation: fadeInUp 0.8s ease forwards; }
        .hero__title { animation-delay: 0.1s; } .hero__description { animation-delay: 0.2s; } 
        .hero__cta { animation-delay: 0.3s; } .hero__image { animation: fadeInUp 0.8s ease forwards; animation-delay: 0.4s; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo"><a href="/" class="logo">guitarluthier.com</a></div>
            <nav class="header__nav">
                <ul class="nav-list">
                    <li><a href="#inicio" class="nav-link nav-link--active">Inicio</a></li>
                    <li><a href="#acerca" class="nav-link">Acerca de</a></li>
                    <li><a href="#servicios" class="nav-link">Servicios</a></li>
                    <li><a href="#blog" class="nav-link">Blog</a></li>
                    <li><a href="#contacto" class="nav-link">Contacto</a></li>
                </ul>
            </nav>
            <div class="header__cta"><button class="btn btn--primary">Explora Ahora</button></div>
            <button class="mobile-toggle"><span class="hamburger"></span><span class="hamburger"></span><span class="hamburger"></span></button>
        </div>
    </header>
    <main class="main">
        <section class="hero">
            <div class="hero__container">
                <div class="hero__content">
                    <div class="hero__badge">CALIDAD SUPERIOR</div>
                    <h1 class="hero__title">Guitarras Personalizadas Hechas a Mano en España</h1>
                    <p class="hero__description">Descubre la perfección en la fabricación de guitarras Españolas hechas para cada músico, con atención al detalle excepcional.</p>
                    <button class="btn btn--secondary hero__cta">Explora Ahora</button>
                </div>
                <div class="hero__image">
                    <img src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1170&q=80" alt="Guitarrista tocando guitarra acústica artesanal" class="hero__img">
                </div>
            </div>
        </section>
    </main>
    <script>
        // JAVASCRIPT INLINE PARA CANVAS
        (function() {
            'use strict';
            const $ = { qs: s => document.querySelector(s), qsa: s => document.querySelectorAll(s), 
                        on: (e, ev, h) => e && e.addEventListener(ev, h) };
            const CTAButtons = {
                init() { $.qsa('.btn').forEach(btn => $.on(btn, 'click', this.handleClick.bind(this))); },
                handleClick(e) {
                    const text = e.target.textContent;
                    if (text === 'Explora Ahora') {
                        this.showMessage('¡Explorando guitarras personalizadas!');
                        this.triggerCanvasAction('explore_guitars');
                    }
                },
                showMessage(msg) {
                    const toast = document.createElement('div'); toast.textContent = msg;
                    toast.style.cssText = `position:fixed;top:100px;right:20px;background:var(--primary-turquoise);
                    color:var(--dark-navy);padding:1rem 1.5rem;border-radius:8px;z-index:9999;font-weight:500;
                    transform:translateX(100%);transition:transform 0.3s ease;box-shadow:0 8px 25px rgba(78,205,196,0.3);`;
                    document.body.appendChild(toast);
                    setTimeout(() => toast.style.transform = 'translateX(0)', 100);
                    setTimeout(() => { toast.style.transform = 'translateX(100%)'; 
                                      setTimeout(() => toast.remove(), 300); }, 3000);
                },
                triggerCanvasAction(action) {
                    console.log('Canvas Action:', action);
                    if (window.parent && window.parent.postMessage) {
                        window.parent.postMessage({ type: 'CANVAS_ACTION', action: action, 
                                                   timestamp: new Date().toISOString(), 
                                                   source: 'guitar-luthier-web' }, '*');
                    }
                    localStorage.setItem('lastAction', JSON.stringify({ action: action, timestamp: new Date().toISOString() }));
                }
            };
            const HeaderScroll = {
                init() { this.header = $.qs('.header'); $.on(window, 'scroll', this.handleScroll.bind(this)); },
                handleScroll() {
                    const scrollY = window.scrollY;
                    if (scrollY > 100) {
                        this.header.style.background = 'rgba(26, 26, 46, 0.98)';
                        this.header.style.backdropFilter = 'blur(15px)';
                    } else {
                        this.header.style.background = 'rgba(26, 26, 46, 0.95)';
                        this.header.style.backdropFilter = 'blur(10px)';
                    }
                }
            };
            const CanvasIntegration = {
                init() {
                    $.on(window, 'message', this.handleCanvasMessage.bind(this));
                    if (window.parent && window.parent.postMessage) {
                        window.parent.postMessage({ type: 'WEB_READY', timestamp: new Date().toISOString(), 
                                                   capabilities: ['smooth-scroll', 'cta-actions', 'mobile-responsive'] }, '*');
                    }
                },
                handleCanvasMessage(event) {
                    const { data } = event;
                    if (data.type === 'CANVAS_COMMAND') {
                        switch (data.command) {
                            case 'UPDATE_CONTENT': this.updateContent(data.payload); break;
                            case 'TRIGGER_ACTION': CTAButtons.triggerCanvasAction(data.payload.action); break;
                        }
                    }
                },
                updateContent(payload) {
                    if (payload.title) { const title = $.qs('.hero__title'); if (title) title.textContent = payload.title; }
                    if (payload.description) { const desc = $.qs('.hero__description'); if (desc) desc.textContent = payload.description; }
                }
            };
            const App = {
                init() {
                    console.log('🎸 Guitar Canvas Ready');
                    CTAButtons.init(); HeaderScroll.init(); CanvasIntegration.init();
                    window.GuitarApp = { getPageData: () => ({ title: $.qs('.hero__title')?.textContent, 
                                                               description: $.qs('.hero__description')?.textContent }),
                                        performAction: (type, data = {}) => {
                                            if (type === 'show-notification') CTAButtons.showMessage(data.message);
                                            if (type === 'trigger-cta') CTAButtons.triggerCanvasAction(data.action);
                                        }};
                    document.body.classList.add('app-ready');
                }
            };
            document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', App.init) : App.init();
        })();
    </script>
</body>
</html>
